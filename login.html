<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sessió - GumMap</title>
    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo-icon">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="24" cy="24" r="22" fill="url(#logoGrad)" stroke="white" stroke-width="2"/>
                        <path d="M24 12v24M12 24h24" stroke="white" stroke-width="4" stroke-linecap="round"/>
                        <defs>
                            <linearGradient id="logoGrad" x1="0" y1="0" x2="48" y2="48">
                                <stop stop-color="#0891b2"/>
                                <stop offset="1" stop-color="#06b6d4"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
                <h1>GumMap</h1>
                <p class="subtitle">Consultori de negocis sanitaris</p>
            </div>
            <form id="loginForm" class="login-form" autocomplete="off">
                <div class="form-group">
                    <label for="username">Usuari</label>
                    <input type="text" id="username" name="username" required autocomplete="username" placeholder="Introdueix el teu usuari">
                </div>
                <div class="form-group">
                    <label for="password">Contrasenya</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="Introdueix la contrasenya">
                </div>
                <div id="errorMsg" class="error-message" role="alert" aria-live="polite"></div>
                <button type="submit" class="btn-login">Entrar</button>
            </form>
        </div>
    </div>
    <script src="./js/auth.js"></script>
</body>
</html>
